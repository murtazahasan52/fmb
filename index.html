<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FMB Fateha Card Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: form panel on the left, live card preview on the right; stacks on phone (preview first). */
:root{
  --bg:#f3f1ec; --panel:#ffffff; --ink:#26221b; --muted:#6f675a; --line:#e2dccf;
  --gold:#a8792a; --gold-deep:#7d5717; --field:#fbfaf7; --focus:#c99a3c;
  --display:"EB Garamond", Georgia, "Times New Roman", serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1814; --panel:#24211b; --ink:#f0ebe0; --muted:#b0a794; --line:#3a352b;
  --gold:#d9b25e; --gold-deep:#e8c87a; --field:#1d1b16; --focus:#d9b25e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1814; --panel:#24211b; --ink:#f0ebe0; --muted:#b0a794; --line:#3a352b;
  --gold:#d9b25e; --gold-deep:#e8c87a; --field:#1d1b16; --focus:#d9b25e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-family:var(--display);font-weight:700;font-size:1.75rem;margin:0;color:var(--gold-deep);text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}.preview{order:-1}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px;min-width:0}
.panel h2{font-family:var(--display);font-size:1.15rem;margin:0;color:var(--gold-deep);font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
label{display:grid;gap:5px;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
input,textarea,select{font:inherit;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:7px;padding:10px 11px;width:100%}
textarea{resize:vertical;min-height:96px;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.8rem;font-weight:600;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--gold)}
.hint{font-size:.78rem;color:var(--muted);margin:0;line-height:1.4}
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.card img{display:block;width:100%;height:auto;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:.92rem;padding:11px 16px;border-radius:8px;border:1px solid var(--gold);background:var(--gold);color:#fff;cursor:pointer;flex:1 1 auto}
.btn.ghost{background:transparent;color:var(--gold-deep)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.status{font-size:.8rem;color:var(--muted);min-height:1.2em;margin:0}
.mobile-only{display:none}
@media (max-width:820px){.preview{position:static;top:auto}.mobile-only{display:block}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Fateha Card Maker</h1>
    <p>Faiz ul Mawaid il Burhaniyah · Saifee Mohalla, Nagpur</p>
  </header>

  <div class="grid">
    <form class="panel" id="f" autocomplete="off">
      <h2>Card details</h2>

      <label>Title
        <input id="title" list="titles" value="KHEER PAR FATEHA">
        <datalist id="titles">
          <option value="KHEER PAR FATEHA"></option>
          <option value="FATEHA"></option>
          <option value="ZIYAFAT"></option>
          <option value="NIYAZ"></option>
          <option value="SALAWAAT"></option>
        </datalist>
      </label>

      <div class="row">
        <label>Name – line 1
          <input id="name1" value="Shaikh Shabbir Husain M.">
        </label>
        <label>Name – line 2
          <input id="name2" value="Mushrraf Husain Ezzy">
        </label>
      </div>

      <label>Relations (one per line)
        <textarea id="rel">Father of Zaineb Husain Gulzar
Father in law of Husain Shk Shabbir Gulzar</textarea>
      </label>
      <div class="chips" aria-label="Add a relation line">
        <button type="button" class="chip" data-r="Father of ">+ Father of</button>
        <button type="button" class="chip" data-r="Mother of ">+ Mother of</button>
        <button type="button" class="chip" data-r="Father in law of ">+ Father in law of</button>
        <button type="button" class="chip" data-r="Mother in law of ">+ Mother in law of</button>
        <button type="button" class="chip" data-r="Grandfather of ">+ Grandfather of</button>
        <button type="button" class="chip" data-r="Husband of ">+ Husband of</button>
        <button type="button" class="chip" data-r="Wife of ">+ Wife of</button>
      </div>

      <label>Note (shop / place)
        <input id="note" value="Taheri Shop, Itwari">
      </label>

      <div class="row">
        <label>Date (optional)
          <input id="date" placeholder="e.g. 6 October 2026">
        </label>
        <label>Hijri date (optional)
          <input id="hijri" placeholder="e.g. 24 Rabi ul Aakhar 1448H">
        </label>
      </div>
      <p class="hint">The preview updates as you type. Long names shrink automatically to fit the card.</p>
      <div class="actions">
        <button type="button" class="btn ghost" id="clear">Clear fields</button>
        <button type="button" class="btn mobile-only" id="toCard">View card &amp; download</button>
      </div>
    </form>

    <aside class="preview" id="preview">
      <div class="card">
        <img id="out" alt="Fateha card preview">
      </div>
      <div class="actions">
        <button type="button" class="btn" id="dl">Download image</button>
        <button type="button" class="btn ghost" id="share">Share</button>
      </div>
      <p class="status" id="status">On a phone you can also long-press the card to save it.</p>
    </aside>
  </div>
</div>

<canvas id="cv" width="1080" height="1480" hidden></canvas>

  const W = 1080, H = 1480, BG = "#f7f7f7";
  const PLACE = "SAIFEE MOHALLA, NAGPUR";
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const out = document.getElementById("out"), statusEl = document.getElementById("status");
  const $ = id => document.getElementById(id);

  function goldFill(y0, y1){
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, "#c9a04a"); g.addColorStop(0.45, "#a97b26"); g.addColorStop(1, "#7f5a19");
    return g;
  }
  function wrap(text, font, maxW){
    ctx.font = font;
    const words = text.split(/\s+/).filter(Boolean), lines = [];
    let cur = "";
    for (const w of words){
      const t = cur ? cur + " " + w : w;
      if (ctx.measureText(t).width <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; }
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function spaced(text, x, y, spacing){
    // centred text with letter spacing
    const chars = [...text];
    let total = 0;
    chars.forEach((c,i)=>{ total += ctx.measureText(c).width + (i<chars.length-1?spacing:0); });
    let cx = x - total/2;
    ctx.textAlign = "left";
    chars.forEach(c=>{ ctx.fillText(c, cx, y); cx += ctx.measureText(c).width + spacing; });
    ctx.textAlign = "center";
  }
  function frame(){
    ctx.strokeStyle = "#b8903f"; ctx.lineWidth = 3;
    ctx.strokeRect(30, 30, W-60, H-60);
    ctx.lineWidth = 1.2;
    ctx.strokeRect(42, 42, W-84, H-84);
    // small diamond at each corner
    ctx.fillStyle = "#b8903f";
    [[42,42],[W-42,42],[42,H-42],[W-42,H-42]].forEach(([x,y])=>{
      ctx.beginPath(); ctx.moveTo(x,y-9); ctx.lineTo(x+9,y); ctx.lineTo(x,y+9); ctx.lineTo(x-9,y); ctx.closePath(); ctx.fill();

  function divider(y, flip){
    const cx = W/2;
    const lg = (x0,x1)=>{ const g = ctx.createLinearGradient(x0,0,x1,0); g.addColorStop(0,"rgba(176,137,58,0)"); g.addColorStop(1,"rgba(176,137,58,1)"); return g; };

  function layout(v, s){
    // returns blocks with sizes for scale s
    const maxW = W - 180;
    const nameFont = `600 ${Math.round(66*s)}px "EB Garamond", Georgia, serif`;
    const relFont  = `500 ${Math.round(42*s)}px "EB Garamond", Georgia, serif`;
    const noteFont = `italic 500 ${Math.round(40*s)}px "EB Garamond", Georgia, serif`;
    const dateFont = `600 ${Math.round(30*s)}px "Nunito Sans", system-ui, sans-serif`;
    const blocks = [];
    const names = [v.name1, v.name2].filter(Boolean).flatMap(n => wrap(n, nameFont, maxW));
    if (names.length) blocks.push({font:nameFont, color:"#1f1c17", lines:names, lh:84*s, gapAfter:34*s});
    const rels = v.rel.split(/\n/).map(t=>t.trim()).filter(Boolean).flatMap(n => wrap(n, relFont, maxW));
    if (rels.length) blocks.push({font:relFont, color:"#3b352b", lines:rels, lh:56*s, gapAfter:22*s});
    if (v.note) blocks.push({font:noteFont, color:"#8a6420", lines:wrap("(" + v.note.replace(/^\(|\)$/g,"") + ")", noteFont, maxW), lh:54*s, gapAfter:0});
    const dates = [v.date, v.hijri].filter(Boolean).join("  ·  ");
    const h = blocks.reduce((a,b)=>a + b.lines.length*b.lh + b.gapAfter, 0);
    return {blocks, h, dates, dateFont};
  }

  function draw(){

    const k = lw / logo.naturalWidth;

    ctx.font = `500 ${Math.round(27*k)}px "EB Garamond", Georgia, serif`;
    // spacing measured from the bottom of the logo ornament (row 281 of the logo image)
    const ornBottom = 70 + 281*k;

    spaced(PLACE, W/2, placeBase, 3);
    let y = placeBase + 46;

    // Title — fixed size; long titles wrap onto a second line instead of shrinking
    const title = (v.title || "").toUpperCase().replace(/\s+/g," ").trim();
    const T_SIZE = 72, T_SPACE = 4, T_MAX = 880, T_LH = 86;

      let best = null;

        const a = words.slice(0,i).join(" "), b = words.slice(i).join(" ");

    divider(y, true);          // line above the title
    y += 92;
    tLines.forEach((line, i) => {
      if (i) y += T_LH * tSize / T_SIZE;
      ctx.font = tFont(tSize);
      ctx.fillStyle = goldFill(y - tSize*0.7, y);
      spaced(line, W/2, y, T_SPACE);
    });
    y += 54;
    divider(y, false);         // line below the title
    y += 70;

    // Body text, auto-shrinks to fit
    const bottom = H - 70 - 60;
    let s = 1, L = layout(v, s);
    const room = () => bottom - y - (L.dates ? 60 : 0);
    while (L.h > room() && s > 0.55){ s -= 0.04; L = layout(v, s); }
    // centre vertically in available room (top-weighted)
    y += Math.max(0, (room() - L.h) * 0.4);
    L.blocks.forEach(b=>{
      ctx.font = b.font; ctx.fillStyle = b.color;
      b.lines.forEach(line=>{ y += b.lh*0.82; ctx.fillText(line, W/2, y); y += b.lh*0.18; });
      y += b.gapAfter;
    });
    if (L.dates){
      ctx.font = L.dateFont; ctx.fillStyle = "#7a6a4c";
      ctx.fillText(L.dates, W/2, H - 92);
    }
    out.src = cv.toDataURL("image/png");
  }

  function fileName(){
    const base = ($("name1").value || "fateha-card").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase();
    return (base || "fateha-card") + ".png";
  }

  let t; const queue = () => { clearTimeout(t); t = setTimeout(draw, 120); };
  ids.forEach(k => $(k).addEventListener("input", queue));

  document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", ()=>{
    const ta = $("rel"); const cur = ta.value.replace(/\s+$/,"");
    ta.value = (cur ? cur + "\n" : "") + b.dataset.r;
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); queue();
  }));
  $("clear").addEventListener("click", ()=>{
    ["name1","name2","rel","note","date","hijri"].forEach(k => $(k).value = "");
    $("title").value = "KHEER PAR FATEHA"; draw(); $("name1").focus();
  });
  $("f").addEventListener("submit", e => e.preventDefault());
  $("toCard").addEventListener("click", ()=>{ draw(); $("preview").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"}); });

  // Inside the Claude viewer, saves go through its downloads capability; on a normal website, a plain link.
  let dlApi = null;
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(d => { dlApi = d; }).catch(()=>{});
  }
  $("dl").addEventListener("click", ()=>{
    draw();
    const name = fileName();
    if (dlApi) {
      cv.toBlob(async blob=>{
        try { await dlApi.save({filename:name, data:blob}); statusEl.textContent = "Saved " + name + "."; }
        catch(e){
          if (e && e.code === "declined") { statusEl.textContent = "Download cancelled."; return; }
          statusEl.textContent = "Download isn't available here. Long-press or right-click the card and choose Save image.";
        }
      }, "image/png");
      return;
    }
    const a = document.createElement("a");
    a.href = cv.toDataURL("image/png"); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    statusEl.textContent = "Saved as " + name + ". If nothing downloaded, long-press or right-click the card and choose Save image.";
  });
  if (!(navigator.canShare && window.File && navigator.canShare({files:[new File(["x"], "x.png", {type:"image/png"})]}))) {
    $("share").hidden = true;
  }
  $("share").addEventListener("click", ()=>{
    draw();
    cv.toBlob(async blob=>{
      try{
        const file = new File([blob], fileName(), {type:"image/png"});
        if (navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title: $("title").value});
          statusEl.textContent = "Shared.";
        } else {
          statusEl.textContent = "Sharing isn't available here. Use Download, or long-press the card to save it.";
        }
      }catch(e){
        if (e && e.name === "AbortError") return;
        statusEl.textContent = "Sharing isn't available here. Use Download, or long-press the card to save it.";
      }
    }, "image/png");
  });

  logo.onload = ()=>{
    const fontsReady = document.fonts ? Promise.all([
      document.fonts.load('700 80px "EB Garamond"'),
      document.fonts.load('600 66px "EB Garamond"'),
      document.fonts.load('500 42px "EB Garamond"'),
      document.fonts.load('italic 500 40px "EB Garamond"'),
      document.fonts.load('600 30px "Nunito Sans"')
    ]).catch(()=>{}) : Promise.resolve();
    const timeout = new Promise(r => setTimeout(r, 2500));
    ready = true; draw();
    Promise.race([fontsReady, timeout]).then(draw);
  };
  logo.src = LOGO_SRC;
})();
</script>
